<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Schreibwerkstatt Editor</title>
  <!-- App-eigene Host-Styles. Als <link> im <head> geladen → SYNCHRON vor der
       JS-Injektion des OTA-Bundle-CSS (injectCss() unten). Diese Reihenfolge
       ist Voraussetzung für die `!important`-Overrides in der Datei. Die Datei
       wird von BundleManager aus den App-Assets neben host.html kopiert. -->
  <link rel="stylesheet" href="./editor-host.css" />
</head>
<body>
  <div id="mount"></div>

  <script>
    // Theme synchron beim Boot setzen — der Editor-Kern reagiert auf
    // <html data-theme="dark"> (Token-CSS `:root[data-theme="dark"]`), NICHT auf
    // eine prefers-color-scheme-Media-Query. Wert kommt vom nativen Host
    // (SWHost.prefersDark(), folgt isSystemInDarkTheme). Vor injectCss(), damit
    // kein Hell-Flash entsteht.
    (function () {
      try {
        const dark = window.SWHost && window.SWHost.prefersDark && window.SWHost.prefersDark();
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        if (dark) document.documentElement.style.background = '#1a1f3a';
      } catch (e) { /* nicht-fatal: Editor läuft im Hell-Default weiter */ }
    })();

    // Promise-Registry für die native Bridge. Die @JavascriptInterface-Methoden
    // (window.SWHost) sind synchrone Java-Calls; das eigentliche Ergebnis löst
    // die native Seite asynchron über window.__sw.resolve/reject ein
    // (via evaluateJavascript).
    (function () {
      const pending = new Map();
      let seq = 0;

      // --- Block-Formatierung (native Android-Toolbar ruft window.__sw.insertHr /
      // insertChecklist; Checkbox-Toggle + Enter-Handling via delegierte Listener
      // unten). Alles app-eigen in host.html — nicht im OTA-Bundle, also nur im
      // Android-Client sichtbar. Einfügen dispatcht `input` → die Standalone-
      // Engine markiert dirty + autosaved über die Bridge/ContentRepository. ---
      const activeEditor = () =>
        document.querySelector('.focus-editor.is-active .focus-editor__content')
          || document.querySelector('.focus-editor__content');

      // Oberster Block-Vorfahr des Carets innerhalb des Editor-Containers.
      function currentBlock(el) {
        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return null;
        let node = sel.getRangeAt(0).startContainer;
        if (!el.contains(node)) return null;
        if (node.nodeType === 3) node = node.parentNode;
        while (node && node.parentNode && node.parentNode !== el) node = node.parentNode;
        return node && node !== el && el.contains(node) ? node : null;
      }

      function placeCaret(node) {
        const sel = window.getSelection();
        const range = document.createRange();
        range.selectNodeContents(node);
        range.collapse(true);
        sel.removeAllRanges();
        sel.addRange(range);
      }

      // Ein leeres Checkbox-Item (Markup identisch zum Notebook-Editor).
      function makeTodoItem() {
        const li = document.createElement('li');
        li.className = 'todo-item';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        const span = document.createElement('span');
        span.className = 'todo-text';
        span.appendChild(document.createElement('br'));
        li.appendChild(cb);
        li.appendChild(span);
        return { li, span };
      }

      // ── Typewriter-Anker (Schreiblinie) ─────────────────────────────────────
      // Die Schreiblinie soll optisch in der Mitte des SICHTBAREN Bildschirms
      // liegen. Über der WebView sitzen aber Statusleiste, TopAppBar und ggf. der
      // Sync-Streifen, unter ihr bei offener Tastatur nichts — die WebView-Mitte
      // liegt damit deutlich unter der Bildschirmmitte, die Schreiblinie klebt
      // an der Tastatur. Diese Chrome-Höhen kennt nur die native Seite; sie
      // schickt darum den fertigen Anker als Anteil der WebView-Höhe
      // (`EditorScreen.kt` → `window.__sw.setTypewriterAnchor`).
      //
      // Der Anteil steuert zwei Dinge:
      //  1. `--sw-pad-top`/`--sw-pad-bottom` (editor-host.css): die Puffer, damit
      //     erste und letzte Zeile die Linie überhaupt erreichen können. Die
      //     Formel des Bundles rechnet mit `100vh` als Layout-Höhe UND
      //     `--focus-vh` als Sichthöhe — im Browser fallen die bei offener
      //     Tastatur auseinander, in dieser Schale nicht (die WebView schrumpft
      //     real). Hier wird der Puffer darum direkt aus dem Anker gerechnet.
      //  2. `host.typewriterAnchor`, den die Engine pro Recenter liest.
      let anchorRatio = 0.5;

      // Sichtbare WebView-Höhe in CSS-Pixeln. Die WebView endet (dank
      // `imeAnimationTarget`-Padding) an der Tastaturkante, ihr Layout-Viewport
      // IST also der sichtbare Bereich.
      function viewportH() {
        return document.documentElement.clientHeight || window.innerHeight || 0;
      }

      // Puffer wachsen nur (pro Bildschirmbreite). Ein Puffer GRÖSSER als nötig
      // ist harmlos: erste/letzte Zeile erreichen die Schreiblinie weiterhin, es
      // bleibt nur etwas mehr Leerraum am Seitenrand. Ein schrumpfender Puffer
      // verschiebt dagegen den gesamten Inhalt gegenüber der Scroll-Position —
      // beim Öffnen der Tastatur (WebView wird kleiner) sichtbar als Sprung des
      // ganzen Textes. Die Breite als Schlüssel setzt bei Rotation zurück, wo ein
      // Puffer aus dem Hochformat sonst dauerhaft zu gross bliebe.
      const pad = { w: -1, top: 0, bottom: 0 };

      function applyAnchorPadding() {
        const h = viewportH();
        if (!(h > 0)) return;
        const w = document.documentElement.clientWidth || 0;
        if (w !== pad.w) { pad.w = w; pad.top = 0; pad.bottom = 0; }
        const a = Math.round(h * anchorRatio);
        pad.top = Math.max(pad.top, a);
        pad.bottom = Math.max(pad.bottom, h - a);
        const s = document.documentElement.style;
        s.setProperty('--sw-pad-top', pad.top + 'px');
        s.setProperty('--sw-pad-bottom', pad.bottom + 'px');
      }

      // Anker für die Engine. Sie bezieht den Anteil auf `visualViewport.height`
      // (`typewriter.js#anchorY`), die Puffer oben hängen an `clientHeight`.
      // Melden beide dasselbe, ist der Faktor 1; weicht `visualViewport` in der
      // WebView ab, hält diese Umrechnung die Linie trotzdem exakt auf
      // `clientHeight * anchorRatio` — Linie und Puffer bleiben konsistent.
      function engineAnchor() {
        const h = viewportH();
        const vv = window.visualViewport;
        const base = vv && vv.height > 0 ? vv.height : h;
        if (!(h > 0) || !(base > 0)) return anchorRatio;
        return Math.min(Math.max((h * anchorRatio) / base, 0.05), 0.95);
      }

      // Tastatur/Rotation ändern die WebView-Höhe → Puffer nachziehen. Der Anker
      // selbst ist ein Anteil und bleibt gültig; die native Seite schickt bei
      // geänderter Chrome-Höhe einen neuen.
      window.addEventListener('resize', applyAnchorPadding);
      window.visualViewport && window.visualViewport.addEventListener('resize', applyAnchorPadding);

      // Text des zuletzt an die native Seite übergebenen Saves. Ein gemergter
      // Server-Stand (applyServerPage) wird nur eingespielt, solange der Editor
      // noch genau diesen Text zeigt — sonst gingen seither Getipptes verloren.
      // Verglichen wird der Klartext: Fokus-Markup (aktiver Absatz) ändert sich
      // mit dem Caret, ohne dass etwas geschrieben wurde.
      let lastSentText = null;
      function editorText() {
        const el = document.querySelector('.focus-editor__content');
        return el ? el.textContent : null;
      }

      // Caret über setPage hinweg retten. setPage ist für den Abschnittswechsel
      // gebaut: der Fokus-Eintritt springt ans Ende und hängt einen leeren
      // Auto-Slot an — Weitergetipptes landete nach einem Merge sonst in einem
      // neuen Absatz. Der leere Slot bleibt stehen (geht beim Save nicht mit).
      // Gemerkt wird Block (data-bid) + Klartext-Offset darin: der Merge lässt
      // den eigenen Block unangetastet, das Fokus-Markup darf sich ändern.
      function captureCaret() {
        const root = document.querySelector('.focus-editor__content');
        const sel = window.getSelection();
        if (!root || !sel || !sel.rangeCount) return null;
        const r = sel.getRangeAt(0);
        if (!root.contains(r.startContainer)) return null;
        const start = r.startContainer.nodeType === 1 ? r.startContainer : r.startContainer.parentElement;
        const blk = start && start.closest('[data-bid]');
        if (!blk || !root.contains(blk)) return null;
        const pre = document.createRange();
        pre.selectNodeContents(blk);
        pre.setEnd(r.startContainer, r.startOffset);
        return { bid: blk.getAttribute('data-bid'), offset: pre.toString().length,
                 focused: root.contains(document.activeElement) };
      }
      function restoreCaret(c) {
        const root = document.querySelector('.focus-editor__content');
        if (!c || !root) return;
        const blk = root.querySelector('[data-bid="' + CSS.escape(c.bid) + '"]');
        if (!blk) return;
        const range = document.createRange();
        const walker = document.createTreeWalker(blk, NodeFilter.SHOW_TEXT);
        let rest = c.offset, node, placed = false;
        while ((node = walker.nextNode())) {
          if (rest <= node.length) { range.setStart(node, rest); placed = true; break; }
          rest -= node.length;
        }
        if (!placed) { range.selectNodeContents(blk); range.collapse(false); }
        range.collapse(true);
        if (c.focused) root.focus({ preventScroll: true });
        const sel = window.getSelection();
        sel.removeAllRanges();
        sel.addRange(range);
      }

      window.__sw = {
        nextId() { return 'r' + (++seq); },
        // Aus bridge.savePage: festhalten, welcher Stand gerade gesendet wird.
        noteSent() { lastSentText = editorText(); },
        // Anker-Anteil der WebView-Höhe (0–1), von der nativen Seite gesetzt.
        setTypewriterAnchor(ratio) {
          const v = Number(ratio);
          if (Number.isFinite(v) && v > 0.05 && v < 0.95) anchorRatio = v;
          applyAnchorPadding();
        },
        // Nach dem Mount aufgerufen (boot): den Anker am Host verankern. Als
        // Getter, damit jeder Recenter den aktuellen Stand liest, ohne dass wir
        // bei jedem Viewport-Tick ein Feld nachschreiben müssten.
        installAnchor(host) {
          applyAnchorPadding();
          if (!host) return;
          try {
            Object.defineProperty(host, 'typewriterAnchor', {
              configurable: true,
              get: engineAnchor,
            });
          } catch (e) { /* nicht-fatal: Host behält den statischen Bridge-Wert */ }
        },
        track(id) {
          return new Promise((resolve, reject) => pending.set(id, { resolve, reject }));
        },
        resolve(id, json) {
          const p = pending.get(id); if (!p) return; pending.delete(id);
          try { p.resolve(json ? JSON.parse(json) : null); }
          catch (e) { p.reject(e); }
        },
        reject(id, msg) {
          const p = pending.get(id); if (!p) return; pending.delete(id);
          p.reject(new Error(msg || 'bridge error'));
        },
        // Von der nativen Diktat-Schicht aufgerufen: Text am Cursor der aktiven
        // Focus-Seite einfügen.
        insertText(text) {
          try {
            const el = document.querySelector('.focus-editor.is-active .focus-editor__content')
              || document.querySelector('.focus-editor__content');
            if (!el) return;
            el.focus();
            const sel = window.getSelection();
            if (!sel || sel.rangeCount === 0) {
              el.appendChild(document.createTextNode(text));
            } else {
              const range = sel.getRangeAt(0);
              range.deleteContents();
              const node = document.createTextNode(text);
              range.insertNode(node);
              range.setStartAfter(node); range.setEndAfter(node);
              sel.removeAllRanges(); sel.addRange(range);
            }
            el.dispatchEvent(new InputEvent('input', { bubbles: true }));
          } catch (e) { /* nicht-fatal */ }
        },
        // Trennlinie (<hr>) hinter dem aktuellen Block einfügen + Schreib-Slot
        // (<p>) dahinter. <hr> übersteht den Server-Cleaner (_STRUCTURAL_LEAF).
        insertHr() {
          try {
            const el = activeEditor();
            if (!el) return;
            el.focus();
            const hr = document.createElement('hr');
            const p = document.createElement('p');
            p.appendChild(document.createElement('br'));
            const block = currentBlock(el);
            if (block) {
              block.insertAdjacentElement('afterend', hr);
            } else {
              el.appendChild(hr);
            }
            hr.insertAdjacentElement('afterend', p);
            placeCaret(p);
            el.dispatchEvent(new InputEvent('input', { bubbles: true }));
          } catch (e) { /* nicht-fatal */ }
        },
        // Checkbox-Liste einfügen. Leeren aktuellen Block ersetzen, sonst dahinter
        // anhängen. Caret landet im Text-Slot des ersten Items.
        insertChecklist() {
          try {
            const el = activeEditor();
            if (!el) return;
            el.focus();
            const ul = document.createElement('ul');
            ul.className = 'todo';
            const { li, span } = makeTodoItem();
            ul.appendChild(li);
            const block = currentBlock(el);
            if (block && !block.textContent.trim()) {
              block.parentNode.replaceChild(ul, block);
            } else if (block) {
              block.insertAdjacentElement('afterend', ul);
            } else {
              el.appendChild(ul);
            }
            placeCaret(span);
            el.dispatchEvent(new InputEvent('input', { bubbles: true }));
          } catch (e) { /* nicht-fatal */ }
        },
        // Seite ohne Speichern austauschen (native Navigation).
        setPage(json) {
          try { window.__swHandle?.setPage(json ? JSON.parse(json) : null); }
          catch (e) {}
        },
        // Der Server hat einen Save gegen einen fremden Stand gemergt (Antwort
        // `merged: true`): den gemergten Stand still einspielen, aber nur, wenn
        // seit dem Absenden nicht weitergeschrieben wurde. Sonst bleibt der
        // Editor-Inhalt; der nächste Save mergt auf dem Server erneut.
        applyServerPage(json) {
          try {
            if (!window.__swHandle || !json) return;
            const text = editorText();
            if (text === null || text !== lastSentText) return;
            const caret = captureCaret();
            window.__swHandle.setPage(JSON.parse(json));
            // setPage betritt den Fokusmodus per $nextTick (Microtask) neu und
            // springt dabei ans Ende in den Auto-Slot — erst danach zurücksetzen.
            if (caret) setTimeout(() => restoreCaret(caret), 0);
          } catch (e) {}
        },
        setGranularity(g) { try { window.__swHandle?.setGranularity(g); } catch (e) {} },
        async save() { try { await window.__swHandle?.save(); } catch (e) {} },
        // Rechtschreibprüfung an/aus (nativ gesteuert, siehe EditorScreen).
        setSpellcheck(on, debounceMs) { setSpellcheck(!!on, debounceMs); },
      };

      // ── Rechtschreibprüfung (LanguageTool) ──────────────────────────────────
      // Der Spellcheck-Controller liegt im OTA-Bundle, wird hier aber selbst
      // gemountet (das Bundle mountet nur den Focus-Kern) und bekommt `checkText`/
      // `addWord` über die native Bridge injiziert: sein Default würde relativ
      // gegen den Asset-Origin (appassets.androidplatform.net) fetchen — dort gibt
      // es weder die Route noch den Authorization-Header.
      const spell = { on: false, debounceMs: 1500, ctl: null, loading: null };

      // Promise-Aufruf einer Bridge-Methode nach dem __sw.track/resolve-Muster.
      function bridgeCall(method, payload) {
        if (!window.SWHost || typeof window.SWHost[method] !== 'function') {
          return Promise.reject(new Error('SWHost.' + method + ' fehlt'));
        }
        const id = window.__sw.nextId();
        const p = window.__sw.track(id);
        window.SWHost[method](id, JSON.stringify(payload || {}));
        return p;
      }

      async function ensureSpellController() {
        if (spell.ctl) return spell.ctl;
        if (!spell.loading) spell.loading = (async () => {
          const root = activeEditor();
          if (!root) return null;
          const [ctlMod, applyMod] = await Promise.all([
            import('./js/cards/editor-spellcheck/controller.js'),
            import('./js/editor/shared/apply-replacement.js'),
          ]);
          let strings = {};
          try { strings = JSON.parse(window.SWHost.spellcheckStrings() || '{}'); } catch (e) {}
          return ctlMod.createSpellcheckController({
            root,
            // `.focus-editor__content` ist selbst der Scroller (overflow-y:auto aus
            // focus-mode.css) — wie im Web-Fokusmodus. Der Popover hängt sich dort
            // als contenteditable="false"-Insel ein und scrollt nativ mit.
            scrollContainer: root,
            getHtml: () => root.innerHTML,
            onApplyReplacement: (range, text) => applyMod.applySpellcheckReplacement(range, text),
            editorKind: 'focus',
            // Die App kennt die Buch-Locale nicht; mit `bookId` (setzt die Bridge)
            // löst der Server sie selbst auf — `language` bleibt darum leer.
            getBookLocale: () => null,
            getBookId: () => null,
            getPageId: () => null,
            isEnabled: () => spell.on,
            getDebounceMs: () => spell.debounceMs,
            i18n: (key) => strings[key] || key,
            checkText: ({ text }) => bridgeCall('ltCheck', { text }),
            addWord: ({ word, lang }) => bridgeCall('ltAddWord', { word, lang }).then(r => !!(r && r.ok)),
          });
        })().then((ctl) => { spell.ctl = ctl; spell.loading = null; return ctl; })
             .catch(() => { spell.loading = null; return null; });
        return spell.loading;
      }

      async function setSpellcheck(on, debounceMs) {
        spell.on = on;
        const ms = Number(debounceMs);
        if (Number.isFinite(ms) && ms > 0) spell.debounceMs = ms;
        if (!on) { try { spell.ctl?.detach(); } catch (e) {} return; }
        const ctl = await ensureSpellController();
        try { ctl?.attach(); } catch (e) {}
      }

      // Schreibzeit-Aktivität: jedes `input` (Tippen im contenteditable, auch das
      // von Diktat/Blockeinfügen dispatchte) meldet — debounced auf 500 ms — dem
      // nativen Host Aktivität, damit dessen Idle-Uhr nicht auf Leerlauf schaltet.
      // capture=true auf document, damit der Listener Page-Remounts des Editors
      // übersteht (er hängt am document, nicht am ausgetauschten .focus-editor).
      let __actT = 0;
      document.addEventListener('input', () => {
        const now = Date.now();
        if (now - __actT < 500) return;
        __actT = now;
        try { window.SWHost && window.SWHost.notifyActivity && window.SWHost.notifyActivity(); }
        catch (e) {}
      }, true);

      // Checkbox-Toggle: nach dem nativen Klick-Toggle das `checked`-ATTRIBUT
      // spiegeln (nur das landet in innerHTML/Save; die `.checked`-Property tut
      // es nicht). Bubbling-Phase, damit der native Toggle schon angewandt ist.
      document.addEventListener('click', (e) => {
        const t = e.target;
        if (!t || t.tagName !== 'INPUT' || t.type !== 'checkbox') return;
        if (!t.closest('li.todo-item')) return;
        if (t.checked) t.setAttribute('checked', '');
        else t.removeAttribute('checked');
        const el = activeEditor();
        if (el) el.dispatchEvent(new InputEvent('input', { bubbles: true }));
      }, false);

      // Enter im Checkbox-Item: neues Item dahinter; leeres Item → Liste verlassen.
      document.addEventListener('keydown', (e) => {
        if (e.key !== 'Enter' || e.shiftKey || e.isComposing) return;
        const sel = window.getSelection();
        if (!sel || sel.rangeCount === 0) return;
        let node = sel.getRangeAt(0).startContainer;
        if (node.nodeType === 3) node = node.parentNode;
        const li = node && node.closest ? node.closest('li.todo-item') : null;
        if (!li) return;
        const ul = li.parentNode;
        e.preventDefault();
        const span = li.querySelector('.todo-text');
        if (!span || !span.textContent.trim()) {
          // Leeres Item → aus der Liste raus in einen frischen Absatz.
          const p = document.createElement('p');
          p.appendChild(document.createElement('br'));
          ul.insertAdjacentElement('afterend', p);
          li.remove();
          if (ul && !ul.querySelector('li')) ul.remove();
          placeCaret(p);
        } else {
          const next = makeTodoItem();
          li.insertAdjacentElement('afterend', next.li);
          placeCaret(next.span);
        }
        const el = activeEditor();
        if (el) el.dispatchEvent(new InputEvent('input', { bubbles: true }));
      }, false);
    })();

    function bootError(msg) {
      document.getElementById('mount').innerHTML =
        '<div class="sw-boot-error">Editor konnte nicht geladen werden:<br>' +
        String(msg).replace(/</g, '&lt;') + '</div>';
      try { window.SWHost && window.SWHost.notifyError(String(msg)); } catch (e) {}
    }

    // CSS-Closure aus dem Bundle-Manifest laden und injizieren (gleiche Reihenfolge
    // wie der Server-Builder, CSS_FILES). Robust gegen Drift: keine fixe Liste hier.
    async function injectCss() {
      try {
        const manifest = await fetch('./bundle-manifest.json').then(r => r.json());
        for (const href of (manifest.cssFiles || [])) {
          const link = document.createElement('link');
          link.rel = 'stylesheet';
          link.href = './' + href;
          document.head.appendChild(link);
        }
      } catch (e) { /* CSS optional — Editor läuft auch ohne Styles */ }
    }

    // Bridge, die der Editor-Kern erwartet (siehe focus/standalone.js):
    //   loadPage(): Promise<{ id, name, html }>
    //   savePage({ id, name, html }): Promise<any>
    const bridge = {
      granularity: 'paragraph',
      typewriterAnchor: 0.5,
      loadPage() {
        if (!window.SWHost) return Promise.reject(new Error('SWHost fehlt'));
        const id = window.__sw.nextId();
        const p = window.__sw.track(id);
        window.SWHost.loadPage(id);
        return p;
      },
      savePage(page) {
        if (!window.SWHost) return Promise.reject(new Error('SWHost fehlt'));
        const id = window.__sw.nextId();
        const p = window.__sw.track(id);
        window.__sw.noteSent();
        window.SWHost.savePage(id, JSON.stringify(page || {}));
        return p;
      },
    };

    (async function boot() {
      try {
        await injectCss();
        const mod = await import('./js/editor/focus/standalone.js');
        const handle = await mod.mountStandaloneFocus({
          mount: document.getElementById('mount'),
          bridge,
        });
        window.__swHandle = handle;
        // Schreiblinie: Anker-Getter am Host verankern + Puffer setzen, bevor
        // der erste Recenter läuft.
        try { window.__sw.installAnchor(handle.host); } catch (e) {}
        try { window.SWHost && window.SWHost.onReady(); } catch (e) {}
      } catch (e) {
        bootError(e && e.stack || e);
      }
    })();
  </script>
</body>
</html>
