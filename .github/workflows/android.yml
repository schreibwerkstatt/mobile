name: Android CI

on:
  push:
    branches: [main]
  pull_request:

# Laufende Builds eines Branch/PR abbrechen, wenn neue Commits kommen.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Compile-Target ist JDK 17 (siehe CLAUDE.md / build.gradle.kts).
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # Pflicht-Check des Projekts: Debug-APK muss bauen.
      - name: Assemble debug APK
        run: ./gradlew assembleDebug --stacktrace

      # Flavor-Dimension `distribution`: `testDebugUnitTest` gibt es nicht mehr.
      # Die Tests unter app/src/test sind flavor-unabhängig, darum reicht der Github-Flavor.
      - name: Unit tests
        run: ./gradlew testGithubDebugUnitTest --stacktrace

      - name: Android Lint
        run: ./gradlew lint --stacktrace

      # Berichte (Test/Lint) bei Fehlschlag mitnehmen — erleichtert die Diagnose.
      - name: Upload reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports
          path: |
            app/build/reports/
            app/build/test-results/
          if-no-files-found: ignore

  # Vertrag gegen den aktuellen Server-`main`: zieht `contract/` frisch von GitHub
  # (statt des vendored Stands unter app/src/test/resources/contract/) und fährt nur
  # die Contract-Tests. Zeigt, ob der heutige Server diesen Client bricht — rot heisst:
  # Server-Änderung prüfen (contract/CHANGELOG.md) bzw. Client nachziehen und danach
  # `scripts/sync-contract.sh` committen. Blockiert den `build`-Job nicht.
  contract-latest:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Vertrag vom Server-main holen
        run: scripts/sync-contract.sh --from-github

      - name: Contract-Tests
        run: ./gradlew testGithubDebugUnitTest --tests '*Contract*' --stacktrace

      - name: Upload reports
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: contract-reports
          path: app/build/reports/tests/
          if-no-files-found: ignore
